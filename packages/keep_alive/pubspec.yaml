name: keep_alive
description: Foreground service that keeps the app process alive while a streak run sends.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

# A plugin (not app code) so the alarm's background engine registers it too.
flutter:
  plugin:
    platforms:
      android:
        package: com.streaksaver.keep_alive
        pluginClass: KeepAlivePlugin
